name: Bug report
description: pi-session-affinity sent something it should not have, or did not send something it should have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a transcript, a raw request, a session id, API keys or your gateway's address here.** This
        issue is public. Replace provider names and hosts with `example-gateway` and `example.com`. Security
        problems go to the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected on the wire, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: session-affinity.json
      description: Your config file with provider names and header values replaced by placeholders.
      render: json
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: pi (`pi --version`), pi-session-affinity, Node.js, and your OS.
    validations:
      required: true
  - type: input
    id: serving
    attributes:
      label: What serves the model
      description: The kind of gateway and engine, e.g. "LiteLLM in front of two vLLM servers, hybrid model". No hostnames.
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, ideally with a fake model or a synthetic session. Optional.
