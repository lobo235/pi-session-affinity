name: nightly-pi

# Tests the extension against the newest pi on npm. The extension uses only pi's public extension events and checks
# no pi version at run time, so this job is the guard against a pi change: a failure opens an issue for that pi
# version unless one for it is already open (a failure on a newer pi opens another). It never merges or publishes
# anything. The job that installs and runs the new pi has a read-only token;
# only the reporting job can write, and it installs nothing and runs no package scripts.

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# No npm cache anywhere in this workflow: its test job runs a pi nobody has verified yet, and a cache entry it
# wrote could reach every later run on every branch.

concurrency:
  group: nightly-pi
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.pi.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci

      - name: Find the newest pi
        id: pi
        run: |
          version="$(npm view @earendil-works/pi-coding-agent version)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "unexpected version: $version" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "newest pi: $version"

      - name: Install it
        env:
          PI_VERSION: ${{ steps.pi.outputs.version }}
        run: npm install --save-dev --save-exact "@earendil-works/pi-coding-agent@${PI_VERSION}"

      # Typecheck, unit tests, the load smoke and the wire smoke, all against that pi.
      - run: npm test

  report-failure:
    needs: test
    if: failure() && needs.test.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write # open or update the nightly issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PI_VERSION: ${{ needs.test.outputs.version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open an issue unless one is open
        run: |
          title="Nightly: pi-session-affinity fails on pi ${PI_VERSION}"
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')"
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "The nightly run against pi ${PI_VERSION} failed: ${RUN_URL}. Until it is fixed, add it to the README's *Known issues*."
          fi
